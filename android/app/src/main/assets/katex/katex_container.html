<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="katex.min.css">
    <script src="katex.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        html {
            background: transparent !important;
        }
        body {
            background: transparent !important;
            font-family: "KaTeX_Main", "Times New Roman", serif;
            display: block;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 4px 6px;
        }
        /* ── Display mode (block) ── */
        #math-display {
            display: block;
            width: 100%;
            text-align: center;
            overflow-x: auto;
            overflow-y: hidden;
        }
        #math-display .katex-display {
            margin: 0 !important;
            overflow-x: auto;
            overflow-y: hidden;
        }
        /* ── Inline mode ── */
        #math-inline {
            display: inline;
        }
        /* ── Shared KaTeX sizing ── */
        .katex { font-size: 1.12em !important; line-height: 1.3; }
        .katex-display > .katex { text-align: center; }
        .katex-html { overflow: visible !important; }
        /* ── Error styling ── */
        .katex-error {
            color: #E06C75 !important;
            font-family: monospace !important;
            font-size: 0.85em;
            white-space: pre-wrap;
            word-break: break-all;
        }
        /* ── Theme classes ── */
        body.dark  { color: #ECECF1; }
        body.light { color: #1A1A1E; }
    </style>
</head>
<body class="dark">
    <div id="math-display" style="display:none;"></div>
    <span id="math-inline" style="display:none;"></span>

    <script>
    (function() {
        var lastH = 0;
        var RO = window.ResizeObserver;

        function reportHeight(force) {
            var h = Math.ceil(document.body.scrollHeight);
            if (h < 1) h = 1;
            if (force || Math.abs(h - lastH) >= 1) {
                lastH = h;
                if (window.AndroidBridge) {
                    try { window.AndroidBridge.onHeight(h); } catch(e) {}
                }
            }
        }

        function setupResizeObserver(el) {
            if (RO) {
                var ro = new RO(function() { reportHeight(false); });
                ro.observe(el);
                ro.observe(document.body);
            }
        }

        window.renderMath = function(formula, isDisplay, isDark) {
            document.body.className = (isDark === true || isDark === 'true') ? 'dark' : 'light';

            var displayEl = document.getElementById('math-display');
            var inlineEl  = document.getElementById('math-inline');

            if (isDisplay === true || isDisplay === 'true') {
                inlineEl.style.display  = 'none';
                displayEl.style.display = 'block';
                try {
                    katex.render(formula, displayEl, {
                        displayMode:    true,
                        throwOnError:   false,
                        output:         'html',
                        trust:          true,
                        strict:         'ignore',
                        macros: {
                            "\\R":    "\\mathbb{R}",
                            "\\N":    "\\mathbb{N}",
                            "\\Z":    "\\mathbb{Z}",
                            "\\C":    "\\mathbb{C}",
                            "\\Q":    "\\mathbb{Q}",
                            "\\d":    "\\mathrm{d}",
                            "\\i":    "\\mathrm{i}",
                            "\\e":    "\\mathrm{e}"
                        }
                    });
                } catch(err) {
                    displayEl.textContent = formula;
                }
            } else {
                displayEl.style.display = 'none';
                inlineEl.style.display  = 'inline';
                try {
                    katex.render(formula, inlineEl, {
                        displayMode:    false,
                        throwOnError:   false,
                        output:         'html',
                        trust:          true,
                        strict:         'ignore',
                        macros: {
                            "\\R":    "\\mathbb{R}",
                            "\\N":    "\\mathbb{N}",
                            "\\Z":    "\\mathbb{Z}",
                            "\\C":    "\\mathbb{C}",
                            "\\Q":    "\\mathbb{Q}",
                            "\\d":    "\\mathrm{d}",
                            "\\i":    "\\mathrm{i}",
                            "\\e":    "\\mathrm{e}"
                        }
                    });
                } catch(err) {
                    inlineEl.textContent = formula;
                }
            }

            // Report height on this frame and again after fonts settle
            requestAnimationFrame(function() {
                reportHeight(true);
                setTimeout(function() { reportHeight(true); }, 80);
                setTimeout(function() { reportHeight(true); }, 200);
            });

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function() { reportHeight(true); });
            }

            setupResizeObserver(isDisplay ? displayEl : inlineEl);
        };

        // Backwards compatibility with old renderMath(formula, isDark)
        window.renderMathCompat = function(formula, isDark) {
            window.renderMath(formula, true, isDark);
        };
    })();
    </script>
</body>
</html>
