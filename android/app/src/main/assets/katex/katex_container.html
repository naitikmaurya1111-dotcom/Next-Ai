<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <link rel="stylesheet" href="katex.min.css">
    <script src="katex.min.js"></script>
    <script>
        window.__isKaTeXReady = false;
        window.__pendingRender = null;
        window.renderMath = function(formula, isDark) {
            if (!window.__isKaTeXReady || typeof katex === 'undefined' || !document.getElementById('math-container')) {
                window.__pendingRender = { formula: formula, isDark: isDark };
                return;
            }
            if (window._doRenderMath) {
                window._doRenderMath(formula, isDark);
            }
        };
    </script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: visible;
        }
        body {
            margin: 0;
            padding: 2px 4px;
            background: transparent !important;
            font-family: "KaTeX_Main", "Times New Roman", Times, serif;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            text-align: center;
            min-height: 0;
            width: auto;
            display: inline-block;
            white-space: nowrap !important;
        }
        #math-wrapper {
            display: inline-block;
            min-width: 0;
            text-align: center;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0;
            white-space: nowrap !important;
        }
        #math-container {
            display: inline-block;
            text-align: center;
            font-size: 1.15em;
            max-width: none;
            margin: 0 auto;
            line-height: 1.25;
            white-space: nowrap !important;
        }
        .katex-display {
            margin: 0 !important;
            padding: 2px 0 !important;
            text-align: center;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap !important;
        }
        .katex {
            font-size: 1.1em;
            line-height: 1.25;
            text-rendering: geometricPrecision;
            white-space: nowrap !important;
        }
        .katex .katex-html {
            overflow: visible !important;
            white-space: nowrap !important;
        }
        body.dark {
            color: #ECECF1;
        }
        body.light {
            color: #1A1A1E;
        }
        .katex-error {
            color: #E06C75 !important;
            font-family: monospace !important;
            font-size: 0.9em;
            white-space: nowrap !important;
            word-break: normal !important;
        }
    </style>
</head>
<body class="dark">
    <div id="math-wrapper">
        <div id="math-container"></div>
    </div>
    <script>
        var lastReportedHeight = 0;
        var lastReportedWidth = 0;

        function reportSize(force) {
            var container = document.getElementById('math-container');
            if (!container) return;
            var rect = container.getBoundingClientRect();
            var bodyH = document.body.offsetHeight;
            var h = Math.ceil(Math.max(rect.height + 4, bodyH, 18));
            var w = Math.ceil(Math.max(rect.width + 10, 24));

            if (force || Math.abs(h - lastReportedHeight) >= 1 || Math.abs(w - lastReportedWidth) >= 2) {
                lastReportedHeight = h;
                lastReportedWidth = w;
                if (window.AndroidBridge) {
                    if (window.AndroidBridge.onRenderComplete) {
                        window.AndroidBridge.onRenderComplete(w, h);
                    } else if (window.AndroidBridge.onSize) {
                        window.AndroidBridge.onSize(w, h);
                    } else if (window.AndroidBridge.onHeight) {
                        window.AndroidBridge.onHeight(h);
                    }
                }
            }
        }

        function _doRenderMath(formula, isDark) {
            document.body.className = isDark ? 'dark' : 'light';
            var container = document.getElementById('math-container');
            if (!container) return;
            try {
                katex.render(formula, container, {
                    displayMode: true,
                    throwOnError: false,
                    output: 'htmlAndMathml',
                    trust: true,
                    strict: false
                });
            } catch (err) {
                container.innerText = formula;
            }

            // Always force report size and notify Android on complete
            reportSize(true);

            // Re-check size when fonts finish loading
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function() {
                    reportSize(true);
                });
            }

            // Animation frame checks for dynamic sizing
            requestAnimationFrame(function() {
                reportSize(true);
                setTimeout(function() { reportSize(true); }, 50);
                setTimeout(function() { reportSize(true); }, 180);
            });
        }

        window._doRenderMath = _doRenderMath;
        window.renderMath = _doRenderMath;
        window.__isKaTeXReady = true;

        if (window.__pendingRender) {
            _doRenderMath(window.__pendingRender.formula, window.__pendingRender.isDark);
            window.__pendingRender = null;
        }

        // Use ResizeObserver for automatic size tracking on any content change
        if (window.ResizeObserver) {
            var ro = new ResizeObserver(function() {
                reportSize(false);
            });
            var target = document.getElementById('math-container');
            if (target) ro.observe(target);
        }
    </script>
</body>
</html>
