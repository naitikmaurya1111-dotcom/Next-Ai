<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <link rel="stylesheet" href="katex.min.css">
    <script src="katex.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: visible;
        }
        body {
            margin: 0;
            padding: 8px 16px 14px 16px;
            background: transparent !important;
            font-family: "KaTeX_Main", "Times New Roman", Times, serif;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            text-align: center;
            min-height: 44px;
            width: 100%;
        }
        #math-wrapper {
            display: inline-block;
            min-width: 100%;
            text-align: center;
        }
        #math-container {
            display: inline-block;
            text-align: center;
            font-size: 1.15em;
            max-width: none;
            margin: 0 auto;
        }
        .katex-display {
            margin: 0 !important;
            padding: 4px 0 !important;
            text-align: center;
        }
        .katex {
            font-size: 1.08em;
            line-height: 1.25;
            text-rendering: auto;
        }
        body.dark {
            color: #ECECF1;
        }
        body.light {
            color: #1A1A1E;
        }
        .katex-error {
            color: #ECECF1 !important;
            font-family: monospace !important;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="dark">
    <div id="math-wrapper">
        <div id="math-container"></div>
    </div>
    <script>
        function renderMath(formula, isDark) {
            document.body.className = isDark ? 'dark' : 'light';
            var container = document.getElementById('math-container');
            try {
                katex.render(formula, container, {
                    displayMode: true,
                    throwOnError: false,
                    output: 'htmlAndMathml',
                    trust: true
                });
            } catch (err) {
                container.innerText = formula;
            }

            requestAnimationFrame(function() {
                setTimeout(function() {
                    var rect = container.getBoundingClientRect();
                    var bodyH = document.body.offsetHeight;
                    var scrollH = document.documentElement.scrollHeight;
                    // Provide 20px extra buffer for superscripts, hats, and descenders
                    var h = Math.ceil(Math.max(rect.height + 20, bodyH + 12, scrollH, 48));
                    if (window.AndroidBridge && window.AndroidBridge.onHeight) {
                        window.AndroidBridge.onHeight(h);
                    }
                }, 20);
            });
        }
    </script>
</body>
</html>
