<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <link rel="stylesheet" href="katex.min.css">
    <script src="katex.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: visible;
        }
        body {
            margin: 0;
            padding: 2px 4px;
            background: transparent !important;
            font-family: "KaTeX_Main", "Times New Roman", Times, serif;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            text-align: center;
            min-height: 0;
            width: auto;
            display: inline-block;
        }
        #math-wrapper {
            display: inline-block;
            min-width: 0;
            text-align: center;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0;
        }
        #math-container {
            display: inline-block;
            text-align: center;
            font-size: 1.15em;
            max-width: none;
            margin: 0 auto;
            line-height: 1.25;
        }
        .katex-display {
            margin: 0 !important;
            padding: 2px 0 !important;
            text-align: center;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .katex {
            font-size: 1.1em;
            line-height: 1.25;
            text-rendering: geometricPrecision;
        }
        .katex .katex-html {
            overflow: visible !important;
        }
        body.dark {
            color: #ECECF1;
        }
        body.light {
            color: #1A1A1E;
        }
        .katex-error {
            color: #E06C75 !important;
            font-family: monospace !important;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="dark">
    <div id="math-wrapper">
        <div id="math-container"></div>
    </div>
    <script>
        var lastReportedHeight = 0;
        var lastReportedWidth = 0;

        function reportSize() {
            var container = document.getElementById('math-container');
            if (!container) return;
            var rect = container.getBoundingClientRect();
            var bodyH = document.body.offsetHeight;
            var h = Math.ceil(Math.max(rect.height + 4, bodyH, 18));
            var w = Math.ceil(Math.max(rect.width + 10, 24));

            if (Math.abs(h - lastReportedHeight) >= 2 || Math.abs(w - lastReportedWidth) >= 4) {
                lastReportedHeight = h;
                lastReportedWidth = w;
                if (window.AndroidBridge && window.AndroidBridge.onSize) {
                    window.AndroidBridge.onSize(w, h);
                } else if (window.AndroidBridge && window.AndroidBridge.onHeight) {
                    window.AndroidBridge.onHeight(h);
                }
            }
        }

        function renderMath(formula, isDark) {
            document.body.className = isDark ? 'dark' : 'light';
            var container = document.getElementById('math-container');
            try {
                katex.render(formula, container, {
                    displayMode: true,
                    throwOnError: false,
                    output: 'htmlAndMathml',
                    trust: true,
                    strict: false
                });
            } catch (err) {
                container.innerText = formula;
            }

            reportSize();

            // Wait for fonts to fully load and measure again
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function() {
                    reportSize();
                });
            }

            // Also check on next few animation frames
            requestAnimationFrame(function() {
                reportSize();
                setTimeout(reportSize, 60);
                setTimeout(reportSize, 200);
            });
        }

        // Use ResizeObserver for automatic size tracking on any content change
        if (window.ResizeObserver) {
            var ro = new ResizeObserver(function() {
                reportSize();
            });
            var target = document.getElementById('math-container');
            if (target) ro.observe(target);
        }
    </script>
</body>
</html>
