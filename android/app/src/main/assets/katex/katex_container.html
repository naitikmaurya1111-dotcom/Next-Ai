<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <link rel="stylesheet" href="katex.min.css">
    <script src="katex.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        #math-container {
            display: inline-block;
            min-width: 100%;
            text-align: center;
            font-size: 1.15em;
        }
        .katex-display {
            margin: 0.2em 0 !important;
        }
        body.dark {
            color: #EDEDF0;
        }
        body.light {
            color: #1A1A1E;
        }
        .error-msg {
            color: #E57373;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>
<body class="dark">
    <div id="math-container"></div>
    <script>
        function renderMath(formula, isDark) {
            document.body.className = isDark ? 'dark' : 'light';
            var container = document.getElementById('math-container');
            try {
                katex.render(formula, container, {
                    displayMode: true,
                    throwOnError: false,
                    output: 'htmlAndMathml',
                    trust: true
                });
            } catch (err) {
                container.innerHTML = '<div class="error-msg">' + (err.message || 'Error rendering formula') + '</div>';
            }
            requestAnimationFrame(function() {
                setTimeout(function() {
                    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, 40);
                    if (window.AndroidBridge && window.AndroidBridge.onHeight) {
                        window.AndroidBridge.onHeight(h);
                    }
                }, 40);
            });
        }
    </script>
</body>
</html>
