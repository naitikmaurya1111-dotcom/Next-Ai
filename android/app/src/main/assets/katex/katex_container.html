<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="katex.min.css">
    <script src="katex.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        html {
            background: transparent !important;
            margin: 0;
            padding: 0;
        }
        body {
            background: transparent !important;
            font-family: "KaTeX_Main", "Times New Roman", serif;
            display: block;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 2px 0px;
            text-align: left;
        }
        /* ── Display mode (block) — Left-aligned ChatGPT aesthetic ── */
        #math-display {
            display: flex !important;
            align-items: center;
            justify-content: flex-start !important;
            width: 100%;
            text-align: left !important;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 2px 0;
        }
        #math-display .katex-display {
            display: flex !important;
            justify-content: flex-start !important;
            text-align: left !important;
            margin: 0 !important;
            padding: 2px 0 !important;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .katex-display > .katex {
            text-align: left !important;
            display: inline-block !important;
        }
        /* ── Inline mode ── */
        #math-inline {
            display: inline;
            text-align: left;
        }
        /* ── Shared KaTeX sizing (matches ChatGPT mobile) ── */
        .katex {
            font-size: 1.22em !important;
            line-height: 1.35;
            text-rendering: geometricPrecision;
        }
        .katex-html {
            overflow: visible !important;
        }
        /* ── Error styling ── */
        .katex-error {
            color: #E06C75 !important;
            font-family: monospace !important;
            font-size: 0.85em;
            white-space: pre-wrap;
            word-break: break-all;
        }
        /* ── Theme classes — crisp ChatGPT palette ── */
        body.dark  { color: #ECECF1; }
        body.light { color: #0D0D0D; }
    </style>
</head>
<body class="dark">
    <div id="math-display" style="display:none;"></div>
    <span id="math-inline" style="display:none;"></span>

    <script>
    (function() {
        var lastH = 0;
        var RO = window.ResizeObserver;

        function reportHeight(force) {
            var el = document.getElementById('math-display');
            var h = 0;
            if (el && el.style.display !== 'none') {
                var rect = el.getBoundingClientRect();
                h = Math.ceil(Math.max(rect.height + 6, document.body.scrollHeight, 24));
            } else {
                h = Math.ceil(Math.max(document.body.scrollHeight, 20));
            }
            if (window.AndroidBridge) {
                try {
                    window.AndroidBridge.onHeight(h);
                    lastH = h;
                } catch(e) {}
            }
        }

        function setupResizeObserver(el) {
            if (RO) {
                var ro = new RO(function() { reportHeight(false); });
                ro.observe(el);
                ro.observe(document.body);
            }
        }

        window.renderMath = function(formula, isDisplay, isDark) {
            document.body.className = (isDark === true || isDark === 'true') ? 'dark' : 'light';

            var displayEl = document.getElementById('math-display');
            var inlineEl  = document.getElementById('math-inline');

            var katexOptions = {
                throwOnError: false,
                output: 'html',
                trust: true,
                strict: 'ignore',
                macros: {
                    "\\R": "\\mathbb{R}",
                    "\\N": "\\mathbb{N}",
                    "\\Z": "\\mathbb{Z}",
                    "\\C": "\\mathbb{C}",
                    "\\Q": "\\mathbb{Q}",
                    "\\d": "\\mathrm{d}",
                    "\\i": "\\mathrm{i}",
                    "\\e": "\\mathrm{e}",
                    "\\adj": "\\operatorname{adj}",
                    "\\rank": "\\operatorname{rank}",
                    "\\tr": "\\operatorname{tr}",
                    "\\boldsymbol": "\\mathbf",
                    "\\bm": "\\mathbf",
                    "\\oint": "\\int",
                    "\\unit": "\\mathrm",
                    "\\degree": "^{\\circ}",
                    "\\AA": "\\text{\\AA}",
                    "\\angstrom": "\\text{\\AA}",
                    "\\micro": "\\mu",
                    "\\hbar": "\\hslash",
                    "\\dfrac": "\\frac",
                    "\\tfrac": "\\frac",
                    "\\cfrac": "\\frac"
                }
            };

            if (isDisplay === true || isDisplay === 'true') {
                inlineEl.style.display = 'none';
                displayEl.style.display = 'flex';
                katexOptions.displayMode = true;
                try {
                    katex.render(formula, displayEl, katexOptions);
                } catch(err) {
                    displayEl.textContent = formula;
                }
            } else {
                displayEl.style.display = 'none';
                inlineEl.style.display = 'inline';
                katexOptions.displayMode = false;
                try {
                    katex.render(formula, inlineEl, katexOptions);
                } catch(err) {
                    inlineEl.textContent = formula;
                }
            }

            // Report height immediately and re-check after layout & font loading
            requestAnimationFrame(function() {
                reportHeight(true);
                setTimeout(function() { reportHeight(true); }, 50);
                setTimeout(function() { reportHeight(true); }, 150);
            });

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function() { reportHeight(true); });
            }

            setupResizeObserver(isDisplay ? displayEl : inlineEl);
        };

        // Backwards compatibility
        window.renderMathCompat = function(formula, isDark) {
            window.renderMath(formula, true, isDark);
        };
    })();
    </script>
</body>
</html>
