name: 🚀 Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 📦 Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📋 List output files
        run: find android/app/build/outputs/apk -name "*.apk" -type f

      - name: ⬆️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGY-Chat-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Release Tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag $TAG
          git push origin $TAG

      - name: 🚀 Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "AGY Chat ${{ steps.tag.outputs.tag }}"
          body: |
            ## 📱 AGY Chat — Next AI
            
            ### ⬇️ How to Install
            1. Download `app-debug.apk` below
            2. Transfer to your Android phone
            3. Open the file on your phone
            4. Tap **Install** (enable "Unknown sources" if prompted)
            5. Open AGY Chat → Settings → Enter your Colab server URL → Connect!
            
            ### 🆕 What's in this release
            - Built from commit: `${{ github.sha }}`
            - Built at: `${{ github.event.head_commit.timestamp }}`
            
            ### 📡 Need a server URL?
            See [README.md](README.md) for Colab bridge setup instructions.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
