name: 🚀 Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 📦 Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📋 Check generated APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/ || true
          find android/app/build/outputs/apk -name "*.apk"

      - name: ⬆️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🚀 Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Next AI v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Next AI — Android Assistant App
            
            ### ⬇️ Download & Installation
            1. Download **`app-debug.apk`** from the Assets below
            2. Open the downloaded `.apk` on your Android phone
            3. Tap **Install** (if prompted, tap *Settings* -> *Allow from this source*)
            4. Open **Next AI**
            5. Go to **Settings** and paste your Colab Bridge WebSocket URL
            
            ### ✨ Included Features
            - Connected directly to Antigravity CLI (`agy`)
            - 8 Slash Command Plugins: `/goal`, `/plan`, `/boost`, `/schedule`, `/browser`, `/learn`, `/grill-me`, `/teamwork-preview`
            - Real-time streaming AI chat bubbles
            - Google Drive conversation backup
            - Local SQLite/Room storage
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
